name: Instagram paylaşımı

on:
  schedule:
    # Türkiye saati = UTC+3. Günde 3 paylaşıma çıkmak için bir satır daha ekle.
    - cron: "30 5 * * *"    # 08:30 TR
    - cron: "30 17 * * *"   # 20:30 TR
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece dene (yayınlama)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Deneme çizimi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python bot.py post --dry-run

      - name: Paylaş
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          BACKEND: ${{ vars.BACKEND }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ vars.META_AD_ACCOUNT }}
          STORIES: ${{ vars.STORIES }}
        run: python bot.py post

      - name: Sırayı kaydet
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name "sonkoz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Paylaşım sırası güncellendi"
          git pull --rebase
          git push
