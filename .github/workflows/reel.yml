name: Reels paylaşımı

# Günde 2 reels: 12:30 ve 18:30 TR (karuseller 08:30 / 20:30, story 13:00).
# Asıl tetikleyici cron-job.org; GitHub cron'ları yedek. Dilimde paylaşım yapıldıysa yedekler atlar (--zamanli).
on:
  schedule:
    - cron: "27 9 * * *"    # 12:27 TR
    - cron: "52 9 * * *"    # yedek 12:52
    - cron: "23 10 * * *"   # yedek 13:23
    - cron: "11 11 * * *"   # yedek 14:11
    - cron: "27 15 * * *"   # 18:27 TR
    - cron: "52 15 * * *"   # yedek 18:52
    - cron: "23 16 * * *"   # yedek 19:23
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece dene (yayınlama)"
        type: boolean
        default: true
      zamanli:
        description: "Bu dilimde paylaşıldıysa atla (dış zamanlayıcı için)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post   # karusel ve story işleriyle aynı anda çalışmasın (media dalı ortak)
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - run: pip install -r requirements.txt

      - name: Deneme (Instagram'da hazırla, yayınlama)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          BACKEND: ${{ vars.BACKEND }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ vars.META_AD_ACCOUNT }}
        run: python bot.py reel --dene

      - name: Paylaş
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          BACKEND: ${{ vars.BACKEND }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ vars.META_AD_ACCOUNT }}
        run: python bot.py reel ${{ (github.event_name == 'schedule' || inputs.zamanli) && '--zamanli' || '' }}

      - name: Sırayı kaydet
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          git config user.name "sonkoz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Reels sırası güncellendi"
          git pull --rebase
          git push
